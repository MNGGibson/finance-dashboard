name: Back up the database

# Nightly encrypted dump kept as a workflow artifact for 90 days, on top of the database
# host's own restore window. Decrypt with: gpg --decrypt finance-<date>.sql.gz.gpg
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y-%m-%d)
          # The client must not be older than the server; the runner's apt client is, so use a current image.
          docker run --rm postgres:18 pg_dump "$DATABASE_URL" | gzip > "finance-$stamp.sql.gz"
          size=$(stat -c %s "finance-$stamp.sql.gz")
          echo "dump: $size bytes"
          [ "$size" -gt 10000 ] || { echo "Dump is implausibly small; refusing to store it" >&2; exit 1; }
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" "finance-$stamp.sql.gz"
          rm "finance-$stamp.sql.gz"
          ls -la finance-*.gpg
      - name: Verify the backup opens and holds every table
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          tables=$(gpg --batch --quiet --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --decrypt finance-*.sql.gz.gpg \
                   | gunzip | grep -cE "^COPY public\.(accounts|transactions|category_rules|balance_snapshots) ")
          echo "tables with data in the backup: $tables"
          [ "$tables" -eq 4 ] || { echo "Backup is missing tables" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: finance-db-backup-${{ github.run_id }}
          path: finance-*.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error
