name: Sync bank data

# Four pulls a day (SimpleFIN allows 24), at the same local times as the Mac schedule
# (1:17, 7:17, 13:17, 19:17 Eastern). Cron is UTC and does not follow daylight saving,
# so these drift by an hour half the year, which does not matter.
on:
  schedule:
    - cron: "17 5,11,17,23 * * *"
  workflow_dispatch:

concurrency: sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull the last 14 days and recategorize
        run: python scripts/sync.py --days 14 --recategorize
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SIMPLEFIN_ACCESS_URL: ${{ secrets.SIMPLEFIN_ACCESS_URL }}
      - name: Check in with the watchdog
        if: always() && env.HEALTHCHECK_URL != ''
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL"; else curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL/fail"; fi
